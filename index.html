<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheGrandees AI Office</title>
<style>
  /* Tiny5: пиксельный шрифт с украинскими буквами (лицензия OFL, fonts/OFL.txt). Чёткий при размере, кратном 10px */
  @font-face { font-family: 'Tiny5'; src: url(fonts/tiny5-cyr.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Tiny5'; src: url(fonts/tiny5-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  html, body { margin: 0; height: 100%; background: #0b0a16; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Пиксельный AI-офис, вид сверху. Логика сцены считается в клетках 384x216, а рисуется в буфер вдвое точнее (768x432),
// поэтому у мебели, ботов и улицы есть мелкие детали. Буфер растягивается на экран без сглаживания.
// Агенты = открытые AI-программы на ПК (Claude Code, Claude, Codex, ChatGPT). Данные: http://127.0.0.1:7777/state.
// Поверх сцены: сезоны и погода, ветер за зданием, лампы на столах, перерывы на кофе, такси, реплики, панель агентов.
const APP_VERSION = 'v1.7';                 // показується в панелі справа; з 21.10.2026 нумерація v1.1, далі +0.1 на кожен випуск
const W = 384, H = 216, S = 2, SERVER = 'http://127.0.0.1:7777';
const HASH = location.hash;
const SHOW_HUD = !HASH.includes('nohud');
const DEMO = HASH.includes('demo');                  // только для проверки: ненастоящие агенты
const FAST = HASH.includes('fast');                  // только для проверки: частые перерывы, реплики и смена погоды

function layer() {
  const c = document.createElement('canvas'); c.width = W * S; c.height = H * S;
  const x = c.getContext('2d'); x.setTransform(S, 0, 0, S, 0, 0); x.imageSmoothingEnabled = false;
  return [c, x];
}
const [scr, g] = layer();                            // кадр
const [bgc, b] = layer();                            // неподвижный фон
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let cur = g;                                         // куда рисуют R и Q: в фон, в кадр или в спрайт
// R и P рисуют в клетках сцены, Q и q в мелких пикселях (полклетки, координаты удвоены)
const R = (x, y, w, h, c) => { cur.fillStyle = c; cur.fillRect(Math.round(x), Math.round(y), w, h); };
const P = (x, y, c) => R(x, y, 1, 1, c);
const Q = (x, y, w, h, c) => { cur.fillStyle = c; cur.fillRect(Math.round(x) / S, Math.round(y) / S, Math.round(w) / S, Math.round(h) / S); };
const q = (x, y, c) => Q(x, y, 1, 1, c);
function discQ(cx, cy, r, c, sy = 1) {
  r = Math.round(r);
  for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r + r * 0.6 - y * y)); Q(cx - hw, cy + Math.round(y * sy), hw * 2 + 1, 1, c); }
}
function lineQ(x0, y0, x1, y1, c) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let i = 0; i <= n; i++) q(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c);
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexRgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const shade = (hex, k) => toHex(hexRgb(hex).map(v => v * k));
const mix = (h1, h2, k) => { const a = hexRgb(h1), c = hexRgb(h2); return toHex(a.map((v, i) => v + (c[i] - v) * k)); };
const pick = arr => arr[Math.random() * arr.length | 0];
const rand = (a, b2) => a + Math.random() * (b2 - a);

// ---------- пиксельный шрифт 3x5 (латиница для вывески и табличек) ----------
const FONT = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
  G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
  M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',
  S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',
  Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111',
  '3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010',
  '8':'111101111101111','9':'111101111001110','-':'000000111000000','.':'000000000000010','!':'010010010000010',
  '?':'110001010000010','Т':'111010010010010','К':'101110100110101','Ц':'101101101101111001',':':'000010000010000','#':'101111101111101',' ':'000000000000000'
};
const textW = s => s.length * 4 - 1;                 // ширина в клетках шрифта
// текст в мелких пикселях: px = размер клетки шрифта, hi = светлая верхняя кромка у каждой клетки (как у неоновой трубки)
function textQ(s, x, y, px, col, hi) {
  s = String(s).toUpperCase();
  for (let i = 0; i < s.length; i++) {
    const f = FONT[s[i]] || FONT['-'];
    for (let p = 0; p < f.length; p++) if (f[p] === '1') {
      const gx = x + (i * 4 + p % 3) * px, gy = y + (p / 3 | 0) * px;
      Q(gx, gy, px, px, col); if (hi) Q(gx, gy, px, 1, hi);
    }
  }
}

// ---------- время: по выбранному региону, день и ночь по настоящему восходу и закату ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
// регион: часовой пояс и координаты для часов и восхода/заката; по умолчанию Москва, меняется кнопкой в панели
const REGIONS = [
  { id: 'moscow',      name: 'Москва',          tz: 'Europe/Moscow',      lat: 55.75, lon: 37.62 },
  { id: 'spb',         name: 'Санкт-Петербург', tz: 'Europe/Moscow',      lat: 59.93, lon: 30.34 },
  { id: 'kaliningrad', name: 'Калининград',     tz: 'Europe/Kaliningrad', lat: 54.71, lon: 20.51 },
  { id: 'samara',      name: 'Самара',          tz: 'Europe/Samara',      lat: 53.20, lon: 50.15 },
  { id: 'yekaterinburg', name: 'Екатеринбург',  tz: 'Asia/Yekaterinburg', lat: 56.84, lon: 60.61 },
  { id: 'novosibirsk', name: 'Новосибирск',     tz: 'Asia/Novosibirsk',   lat: 55.03, lon: 82.92 },
  { id: 'vladivostok', name: 'Владивосток',     tz: 'Asia/Vladivostok',   lat: 43.12, lon: 131.89 },
  { id: 'minsk',       name: 'Минск',           tz: 'Europe/Minsk',       lat: 53.90, lon: 27.57 },
  { id: 'kyiv',        name: 'Киев',            tz: 'Europe/Kyiv',        lat: 50.45, lon: 30.52 },
];
let regionId = REGIONS.some(r => r.id === store.get('office-region')) ? store.get('office-region') : 'moscow';
const region = () => REGIONS.find(r => r.id === regionId);
const fmtCache = {};
function fmtFor(tz) {
  if (tz in fmtCache) return fmtCache[tz];
  let f = null;
  for (const timeZone of tz === 'Europe/Kyiv' ? ['Europe/Kyiv', 'Europe/Kiev'] : [tz]) {
    try { f = new Intl.DateTimeFormat('en-GB', { timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit', month: 'numeric', hourCycle: 'h23' }); break; } catch {}
  }
  return fmtCache[tz] = f;
}
// местное время выбранного региона
function localTime() {
  const d = new Date(), f = fmtFor(region().tz);
  if (!f) return { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds(), mon: d.getMonth() + 1 };
  const o = {}; for (const p of f.formatToParts(d)) o[p.type] = +p.value;
  return { h: o.hour % 24, m: o.minute, s: o.second, mon: o.month };
}
const utcMin = (d = new Date()) => d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60;
// восход и закат в выбранном регионе на сегодня (формулы NOAA), в минутах от полуночи UTC
function sunTimes(d = new Date()) {
  const lat = region().lat * Math.PI / 180, lon = region().lon;
  const N = Math.round((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
  const gm = 2 * Math.PI / 365 * (N - 1);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(gm) - 0.032077 * Math.sin(gm) - 0.014615 * Math.cos(2 * gm) - 0.040849 * Math.sin(2 * gm));
  const decl = 0.006918 - 0.399912 * Math.cos(gm) + 0.070257 * Math.sin(gm) - 0.006758 * Math.cos(2 * gm) + 0.000907 * Math.sin(2 * gm) - 0.002697 * Math.cos(3 * gm) + 0.00148 * Math.sin(3 * gm);
  const ha = Math.acos(Math.cos(90.833 * Math.PI / 180) / (Math.cos(lat) * Math.cos(decl)) - Math.tan(lat) * Math.tan(decl)) * 180 / Math.PI;
  return { rise: 720 - 4 * (lon + ha) - eqt, set: 720 - 4 * (lon - ha) - eqt };
}
// минуты UTC в местное «ЧЧ:ММ» выбранного региона
function localHM(m) {
  const k = localTime(), off = Math.round((((k.h * 60 + k.m) - Math.floor(utcMin())) % 1440 + 1440) % 1440 / 30) * 30;
  const v = Math.round(m + off + 1440) % 1440;
  return `${String(v / 60 | 0).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`;
}
function setRegion(id) {
  if (!REGIONS.some(r => r.id === id)) return;
  regionId = id; store.set('office-region', id);
  refreshScene();
}
// сумерки: от 40 минут до восхода до 30 после, и от 30 минут до заката до 40 после
function phaseNow() {
  const forced = HASH.match(/night|dusk|day/);
  if (forced) return forced[0];
  const { rise, set } = sunTimes(), m = utcMin();
  if ((m >= rise - 40 && m < rise + 30) || (m >= set - 30 && m < set + 40)) return 'dusk';
  return m >= rise + 30 && m < set - 30 ? 'day' : 'night';
}
let phase = phaseNow();

// ---------- сезон: авто по месяцу или выбранный кнопкой ----------
const SEASONS = ['auto', 'spring', 'summer', 'autumn', 'winter'];
const SEASON_UA = { auto: 'Авто', spring: 'Весна', summer: 'Літо', autumn: 'Осінь', winter: 'Зима' };
let seasonPick = SEASONS.includes(store.get('office-season')) ? store.get('office-season') : 'auto';
function seasonNow() {
  const forced = HASH.match(/spring|summer|autumn|winter/);
  if (forced) return forced[0];
  if (seasonPick !== 'auto') return seasonPick;
  const m = localTime().mon;
  return m === 12 || m <= 2 ? 'winter' : m <= 5 ? 'spring' : m <= 8 ? 'summer' : 'autumn';
}
let season = seasonNow();
function setSeason(v) {
  if (!SEASONS.includes(v)) return;
  seasonPick = v; store.set('office-season', v);
  refreshScene();
}

// ---------- погода: в режиме «Авто» меняется сама каждые 6–15 минут, с учётом сезона ----------
const WEATHERS = ['auto', 'clear', 'rain', 'storm', 'snow', 'fog', 'wind'];
const WEATHER_UA = { auto: 'Авто', clear: 'Ясно', rain: 'Дощ', storm: 'Гроза', snow: 'Сніг', fog: 'Туман', wind: 'Вітер' };
const WEATHER_MIX = {                                // как часто бывает каждая погода в сезоне
  winter: { snow: 5, clear: 2.5, fog: 1.5, wind: 1 },
  spring: { clear: 4, rain: 3, wind: 2, fog: 1 },
  summer: { clear: 4.5, rain: 3, storm: 1.5, wind: 1 },
  autumn: { wind: 3.5, rain: 3, fog: 2, clear: 1.5 },
};
let weatherPick = WEATHERS.includes(store.get('office-weather')) ? store.get('office-weather') : 'auto';
let autoW = (() => { try { return JSON.parse(store.get('office-weather-auto')); } catch { return null; } })();
function weatherNow() {
  const forced = HASH.match(/(?:#|-)(clear|rain|storm|snow|fog|wind)(?=-|$)/);
  if (forced) return forced[1];
  if (weatherPick !== 'auto') return weatherPick;
  const mix = WEATHER_MIX[season];
  if (!autoW || autoW.season !== season || Date.now() > autoW.until || !mix[autoW.kind]) {
    let r = Math.random() * Object.values(mix).reduce((s, v) => s + v, 0), kind = 'clear';
    for (const [k, v] of Object.entries(mix)) if ((r -= v) < 0) { kind = k; break; }
    autoW = { kind, season, until: Date.now() + (FAST ? rand(25, 40) : rand(6, 15) * 60) * 1000 };
    store.set('office-weather-auto', JSON.stringify(autoW));
  }
  return autoW.kind;
}
let weather = weatherNow(), weatherSince = 0;
const isWet = () => weather === 'rain' || weather === 'storm';
const isGrey = () => weather !== 'clear' && weather !== 'wind';
function setWeather(v) {
  if (!WEATHERS.includes(v)) return;
  weatherPick = v; store.set('office-weather', v);
  refreshScene();
}

// Свойства «Сезон» и «Погода» в настройках Wallpaper Engine. При запуске WE присылает сохранённые значения:
// их не применяем повторно, чтобы выбор кнопкой не сбрасывался.
window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    if (p.volume) setVolume(p.volume.value);
    for (const [key, set] of [['season', setSeason], ['weather', setWeather], ['sound', v => setSound(v === true || v === 'true')]]) {
      if (!p[key]) continue;
      const v = p[key].value, mem = `office-${key}-prop`;
      if (store.get(mem) === String(v)) continue;
      store.set(mem, String(v));
      set(v);
    }
  },
  // Wallpaper Engine ставит обои на паузу, когда открыта игра на весь экран: тогда и звук молчит
  setPaused(p) { if (p && !paused) pausedAt = performance.now(); if (paused && !p) onReveal(); paused = p; if (ac) { if (p) ac.suspend(); else ac.resume().catch(() => {}); } },
};

const SKY = { night: ['#0d0b24', '#1a1540', '#2b205a'], dusk: ['#4c2b70', '#cf6566', '#f0a05a'], day: ['#5b9de3', '#8cc2f0', '#c4e2f6'] };
const SKY_GREY = { night: ['#0e0d1c', '#17162b', '#22203a'], dusk: ['#3b3150', '#6c5a72', '#8d7a86'], day: ['#7f8ea8', '#9eabc0', '#bcc6d6'] };
const SHADOW_BASE = { night: 'rgba(6,8,34,0.46)', dusk: 'rgba(60,20,70,0.25)', day: null };
const SHADOW_SNOW = { night: 'rgba(14,24,78,0.5)', dusk: 'rgba(60,40,110,0.25)', day: null };
const SHADOW = new Proxy({}, { get: (_, k) => (season === 'winter' ? SHADOW_SNOW : SHADOW_BASE)[k] });
const ROOM_DIM = { night: 'rgba(16,10,44,0.2)', dusk: 'rgba(30,14,50,0.1)', day: null };    // ночью в комнате чуть темнее, но верхний свет горит
const ROOM_WARM = { night: 0.07, dusk: 0.04, day: 0 };
const LOOK = {
  spring: { grass: '#5a9a55', dots: ['#66a85f', '#4e8c4a', '#72b468', '#477f44'], flowers: ['#ff9ab8', '#ffffff', '#ffd35c', '#ffc2d6', '#ff9ab8'], nflow: 220, leaf: ['#2f6e3d', '#3d8a4c', '#58a865'], bloom: ['#ffb3cf', '#ffd6e6'] },
  summer: { grass: '#4a8446', dots: ['#55934f', '#3f743d', '#5c9c57', '#3a6b3b'], flowers: ['#ffd35c', '#ff9ab8', '#ffffff', '#b9a8ff'], nflow: 110, leaf: ['#2a6337', '#357d44', '#4f9c5c'] },
  autumn: { grass: '#7b8646', dots: ['#8a934f', '#6c763c', '#9c8644', '#8f6c38'], flowers: ['#e0745f', '#ffb347', '#ffd35c', '#c4553b', '#d9702f'], nflow: 0, leaf: ['#9c3f2b', '#d06a2c', '#eeb03a'] },
  winter: { grass: '#e3e9f5', dots: ['#d3dcee', '#f3f6fc', '#c6d1e8', '#ffffff'], flowers: [], nflow: 0, leaf: null },
};

// ---------- геометрия (в клетках сцены) ----------
// Здание x 72..312, y 20..164. Стена с окнами 24..44, пол 44..158, дверь внизу x 184..200.
// Слева чилл-зона (x 76..150), коридор x 154, рабочие столы (x 158..266), справа кухня (x 270..308).
const V = 154;
const DESKS = [];
for (let r = 0; r < 2; r++) for (let i = 0; i < 4; i++) {
  const x0 = 158 + i * 28, y0 = r ? 92 : 52, cx = x0 + 12;
  DESKS.push({ x0, y0, cx, lane: y0 + 26, entry: [{ x: cx, y: y0 + 26 }, { x: cx, y: y0 + 20 }], face: 'up', sit: true, owner: null, desk: true, lamp: 0, lampOn: 0 });
}
// act: чем агент занят на этом месте (значок над головой и строка в панели)
const CHILL = [
  { lane: 82, entry: [{ x: 104, y: 82 }, { x: 104, y: 99 }], face: 'up', sit: true, act: 'tv' },
  { lane: 82, entry: [{ x: 126, y: 82 }, { x: 126, y: 99 }], face: 'up', sit: true, act: 'tv' },
  { lane: 142, entry: [{ x: 284, y: 142 }, { x: 284, y: 118 }], face: 'right', sit: true, act: 'tea' },
  { lane: 82, entry: [{ x: 84, y: 82 }, { x: 84, y: 75 }], face: 'up', sit: true, act: 'music' },
  { lane: 142, entry: [{ x: 86, y: 142 }], face: 'up', sit: false, act: 'game' },
  { lane: 78, entry: [{ x: 276, y: 78 }, { x: 276, y: 60 }, { x: 280, y: 60 }], face: 'up', sit: false, act: 'coffee' },
  { lane: 82, entry: [{ x: 115, y: 82 }, { x: 115, y: 99 }], face: 'up', sit: true, act: 'tv' },
  { lane: 142, entry: [{ x: 304, y: 142 }, { x: 304, y: 118 }], face: 'left', sit: true, act: 'coffee' },
  { lane: 82, entry: [{ x: 146, y: 82 }, { x: 146, y: 75 }], face: 'up', sit: true, act: 'music' },
  { lane: 78, entry: [{ x: 290, y: 78 }, { x: 290, y: 88 }, { x: 295, y: 88 }], face: 'right', sit: false, act: 'tea' },
  { lane: 142, entry: [{ x: 120, y: 142 }], face: 'up', sit: false, act: 'phone' },
  { lane: 142, entry: [{ x: 236, y: 142 }], face: 'down', sit: false, act: 'phone' },
].map(s => ({ ...s, owner: null }));
const BREAK_SPOTS = [CHILL[5], CHILL[9]];             // кофемашина и кулер с кипятком
const CAFE = [CHILL[2], CHILL[7]];                    // два табурета у круглого кавового столика на кухні
// место у бордюра, где агент выходит из такси или ждёт его
const curbPlace = () => ({ lane: 142, entry: [{ x: 192, y: 142 }, { x: 192, y: 152 }, { x: 192, y: 166 }, { x: 192, y: 179 }], face: 'down', street: true });
const spotOf = p => p.entry[p.entry.length - 1];
// брифинг: ведущий стоит лицом к команде в проходе под вторым рядом столов
const BRIEF_SPOTS = [[210, 124, 'down'], [184, 137, 'up'], [236, 137, 'up'], [158, 133, 'right'], [262, 133, 'left']]
  .map(([x, y, face]) => ({ lane: 142, entry: [{ x, y: 142 }, { x, y }], face, sit: false, act: 'brief', owner: null }));
// в какой части офиса агент: болтают только те, кто в одной зоне
const zoneOf = a => { const p = a.place; if (p.street || p.out) return 'street'; const x = spotOf(p).x; return x < V ? 'lounge' : x < 268 ? 'desks' : 'kitchen'; };
// лавочка справа на улице: туда выходит отдохнуть агент, которому нечего делать
const BENCH = { lane: 142, entry: [{ x: 192, y: 142 }, { x: 192, y: 152 }, { x: 192, y: 166 }, { x: 192, y: 174 }, { x: 366, y: 174 }, { x: 366, y: 166 }], face: 'down', sit: true, act: 'bench', out: true, owner: null };
const WINDOWS = [198, 230];
const inWindow = (x, y) => y >= 26.5 && y < 41.5 && WINDOWS.some(wx => x >= wx + 0.5 && x < wx + 25.5);
const inBuilding = (x, y) => x >= 71 && x < 313 && y >= 19 && y < 165;
const inSign = (x, y) => x >= 145 && x < 239 && y >= 0 && y < 20;

    // довга репліка: два рядки, розрив по пробілу ближче до середини
    let ls = [a.say.text];
    if (ctx.measureText(a.say.text).width > ctx.measureText('x'.repeat(26)).width) {
      const s = a.say.text, mid = s.length / 2; let br = -1;
      for (let i = 0; i < s.length; i++) if (s[i] === ' ' && (br < 0 || Math.abs(i - mid) < Math.abs(br - mid))) br = i;
      if (br > 0) ls = [s.slice(0, br), s.slice(br + 1)];

const btnAt = e => { const px = e.clientX * dpr, py = e.clientY * dpr; return btns.findIndex(bt => px >= bt.x && px <= bt.x + bt.w && py >= bt.y && py <= bt.y + bt.h); };

// людина вийшла з повноекранної програми (або гри), і шпалери знову видно: офіс «помітив» її

const reveals = [];
function onReveal() {
  const t = performance.now() / 1000;
  if (performance.now() - pausedAt < 5000) return;
  while (reveals.length && t - reveals[0] > 120) reveals.shift();
  if (reveals.length >= 2 || brief) return;
  const here = [...agents.values()].filter(a => avail(a) && arrived(a) && !a.brk?.cafe && a.status !== 'waiting');
  if (!here.length) return;
  reveals.push(t);
  if (talk) { for (const a of talk.who) if (a.say?.talk) a.say = null; talk = null; }
  const a = pick(here), b = pick(here.filter(x => x !== a)) || a;
  say(a, pick(['Опа, він дивиться!', 'Тихо, він дивиться!', 'Ой, нас бачать!']), t + 0.6, true);
  later(t + 4.4, () => avail(b) && say(b, pick(['Робимо вигляд, що працюємо!', 'Всі за роботу!', 'Я тут працюю, чесно']), performance.now() / 1000, true));
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = performance.now(); else if (hiddenAt) { pausedAt = hiddenAt; hiddenAt = 0; onReveal(); } });

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (paused) { last = now; return; }               // пауза (игра на весь экран, панель на Mac спрятана): не рисуем
  const dt = (now - last) / 1000;
  if (dt < 1 / 30 - 0.002) return;                 // не чаще 30 кадров в секунду
  last = now;
  if (document.hidden) return;

  const t = now / 1000;
  frame(t, Math.min(dt, 0.1));
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0b0a16'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(scr, ox, oy, W * ws, H * ws);

  panel(t);
}
